<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e2d"/>
      <stop offset="60%" stop-color="#0f0f17"/>
      <stop offset="100%" stop-color="#09090e"/>
    </radialGradient>
    
    <radialGradient id="blue-glow" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Background Gradient (Dark Mode) -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <linearGradient id="primary-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- UI Accent Colors -->
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg-glow)"/>
  <rect width="1200" height="800" fill="url(#blue-glow)"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200 M0 400H1200 M0 450H1200 M0 500H1200 M0 550H1200 M0 600H1200 M0 650H1200 M0 700H1200 M0 750H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M50 0V800 M100 0V800 M150 0V800 M200 0V800 M250 0V800 M300 0V800 M350 0V800 M400 0V800 M450 0V800 M500 0V800 M550 0V800 M600 0V800 M650 0V800 M700 0V800 M750 0V800 M800 0V800 M850 0V800 M900 0V800 M950 0V800 M1000 0V800 M1050 0V800 M1100 0V800 M1150 0V800" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- MAIN APP CONTAINER / MOCKUP WINDOW -->
  <g filter="url(#shadow-main)">
    <!-- Main Outer Window -->
    <rect x="80" y="40" width="1040" height="720" rx="16" fill="#111118" stroke="#2a2a3c" stroke-width="1.5"/>

    <!-- NAVBAR -->
    <g transform="translate(80, 40)">
      <!-- Navbar Background -->
      <path d="M0 16C0 7.16344 7.16344 0 16 0H1024C1032.84 0 1040 7.16344 1040 16V64H0V16Z" fill="#181824" stroke="#2a2a3c" stroke-width="1"/>
      
      <!-- Brand Logo & Name -->
      <g transform="translate(32, 16)">
        <!-- Logo Icon -->
        <rect x="0" y="0" width="32" height="32" rx="8" fill="#2563eb"/>
        <path d="M10 9H22M10 14H22M10 19H17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="19" r="2" fill="#60a5fa"/>
        
        <!-- App Title -->
        <text x="44" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#ffffff">ResumePulse</text>
        
        <!-- Badge -->
        <rect x="175" y="4" width="64" height="22" rx="11" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
        <text x="184" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#60a5fa">✨ ATS AI</text>
      </g>

      <!-- Nav Tabs Center -->
      <g transform="translate(390, 16)">
        <rect x="0" y="0" width="220" height="34" rx="8" fill="#0f0f17"/>
        <!-- Active Tab -->
        <rect x="3" y="3" width="110" height="28" rx="6" fill="#2563eb"/>
        <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#ffffff">☁️ Resume Analyzer</text>
        <!-- Inactive Tab -->
        <text x="126" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#94a3b8">📜 Saved History</text>
      </g>

      <!-- Right Nav Status -->
      <g transform="translate(730, 18)">
        <!-- Privacy Guard Badge -->
        <rect x="0" y="0" width="200" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <path d="M14 8E14 8 8 10 8 14C8 18 14 21 14 21C14 21 20 18 20 14C20 10 14 8 14 8Z" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Privacy Guard: In-memory</text>

        <!-- User Profile Avatar -->
        <circle cx="224" cy="14" r="14" fill="#2563eb"/>
        <text x="219" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#ffffff">S</text>
      </g>
    </g>

    <!-- MAIN HERO CONTENT SECTION -->
    <g transform="translate(80, 104)">
      <!-- Top Sub-Badge -->
      <g transform="translate(370, 32)">
        <rect x="0" y="0" width="300" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
        <text x="15" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11" fill="#818cf8">✨ Next-Gen ATS Compatibility &amp; Role Optimizer</text>
      </g>

      <!-- Hero Headline -->
      <text x="520" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">AI Resume Analyzer &amp; ATS Optimizer</text>
      
      <!-- Hero Subtitle -->
      <text x="520" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#94a3b8" text-anchor="middle">Analyze your resume, improve ATS compatibility score, and discover exact roles that match your skills.</text>

      <!-- DASHBOARD / FORM CARD -->
      <g transform="translate(220, 155)" filter="url(#shadow-card)">
        <!-- Card Background -->
        <rect x="0" y="0" width="600" height="460" rx="16" fill="url(#card-grad)" stroke="#2a2a3c" stroke-width="1"/>

        <!-- Upload PDF Area (Dashed Box) -->
        <g transform="translate(32, 28)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Upload PDF Resume <tspan fill="#ef4444">*</tspan></text>
          
          <!-- Dashed Dropzone -->
          <rect x="0" y="12" width="536" height="150" rx="12" fill="#0f0f17" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
          
          <!-- Cloud Upload Icon Container -->
          <g transform="translate(244, 32)">
            <circle cx="24" cy="24" r="24" fill="#1e293b"/>
            <path d="M24 17V29M24 17L19 22M24 17L29 22" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 25C12.3431 25 11 23.6569 11 22C11 20.6122 11.9367 19.443 13.2206 19.1192C13.0759 18.5982 13 18.0569 13 17.5C13 14.4624 15.4624 12 18.5 12C20.4708 12 22.1934 13.0375 23.1614 14.5982C23.8643 14.2127 24.6726 14 25.5 14C28.2614 14 30.5 16.2386 30.5 19C30.5 19.3412 30.4657 19.6743 30.4002 19.9965C31.9056 20.4093 33 21.7766 33 23.4 33 25.3882 31.3882 27 29.4 27" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          </g>

          <text x="268" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">
            Drag and drop your PDF resume here, or <tspan fill="#3b82f6" stroke-dasharray="none">browse files</tspan>
          </text>
          <text x="268" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#64748b" text-anchor="middle">PDF format only. Maximum file size: 10MB.</text>
        </g>

        <!-- Target Job Description Input Area -->
        <g transform="translate(32, 220)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">📋 Paste Target Job Description <tspan font-weight="400" fill="#64748b">(Optional)</tspan></text>
          <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="11" fill="#64748b">Providing a job description enables detailed role-specific keyword comparison and match percentages.</text>
          
          <!-- Textarea Box -->
          <rect x="0" y="26" width="536" height="100" rx="8" fill="#0f0f17" stroke="#2a2a3c" stroke-width="1"/>
          <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#475569">Paste the target job requirements, qualifications, or tech stack here (optional)...</text>
        </g>

        <!-- Submit Button -->
        <g transform="translate(32, 368)">
          <rect x="0" y="0" width="536" height="44" rx="8" fill="url(#primary-btn)" filter="url(#glow)"/>
          <text x="255" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#ffffff" text-anchor="middle">✨ Analyze Resume</text>
          <path d="M322 22H332M332 22L328 18M332 22L328 26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Footer Security Note -->
        <g transform="translate(268, 434)">
          <path d="M-125 -2E-125 -2 -128 0 -128 3C-128 6 -125 8 -125 8C-125 8 -122 6 -122 3C-122 0 -125 -2 -125 -2Z" stroke="#10b981" stroke-width="1" stroke-linecap="round" fill="none"/>
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="10" fill="#64748b" text-anchor="middle">Uploaded resumes are processed in-memory and analyzed with Google Gemini AI. Files are not permanently stored.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
